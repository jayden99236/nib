name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x", "24.x"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Compile the examples
        run: |
          npm run build --silent
          for file in examples/*.nib; do
            echo "--- $file"
            node dist/src/cli.js run "$file"
          done
